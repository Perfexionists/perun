[build-system]
requires = [
    "meson-python >= 0.19.0",
    "meson >= 1.11.1",
    "ninja >= 1.13.0",
    "wheel>=0.46.3",
]
build-backend = "mesonpy"

[project]
name = "perun-toolsuite"
description = "Perun: Lightweight Performance Version System"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Tomas Fiedor", email = "TomasFiedor@gmail.com"},
    {name = "Jiri Pavela", email = "Jirka.Pavela@gmail.com"},
    {name = "Radim Podola", email = "rpodola@gmail.com"},
    {name = "Simon Stupinsky", email = "simondestupinsky@gmail.com"},
    {name = "Matus Liscinsky"},
    {name = "Peter Mocary"},
    {name = "Ondrej Michal"},
    {name = "Vojtech Hajek"},
    {name = "Vladimir Hucovic"},
    {name = "Robert Vasek"}
]
dependencies = [
    # Build
    "meson-python>=0.19.0",
    "meson>=1.11.1",
    "ninja>=1.13.0",
    "wheel>=0.46.3",

    # Lazy loading
    "lazy-loader>=0.5",

    # Other
    "psutil>=7.2.2",

    # CLI
    "click>=8.3.2",

    # VCS integration
    "GitPython>=3.1.47",
    "gitdb>=4.0.12",

    # String / text utilities
    "Faker>=40.15.0",
    "ruamel.yaml>=0.19.1",
    "Jinja2>=3.1.6",

    # File analysis
    "python-magic>=0.4.27",
    "angr>=9.2.212",

    # Science / math / statistics / ML
    "numpy>=2.2.6", # Latest release still supporting Python3.10
    "pandas>=2.3.3", # Latest release still supporting Python3.10
    "polars>=1.40.0",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.7.2", # Latest release still supporting Python3.10
    "scipy>=1.15.3", # Latest release still supporting Python3.10
    "networkx>=3.4.2", # Latest release still supporting Python3.10

    # Plotting / visualization / output
    "bokeh>=3.9.0",
    "matplotlib>=3.10.8",
    "termcolor>=3.3.0",
    "tabulate>=0.10.0",
    "holoviews>=1.22.1",
    "progressbar2>=4.5.0",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
    "Sphinx>=8.1.3", # Latest release still supporting Python3.10
    "sphinx-click>=6.2.0",
    "sphinx-autodoc-typehints>=3.0.1", # Latest release still supporting Python3.10
]
lint = [
    "pre-commit>=4.6.0",
    "black>=26.3.1",
    "pylint>=4.0.5",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "tox>=4.53.0",
]
typing = [
    "mypy>=1.20.2",
    "mypy-extensions>=1.1.0",
    "typing-extensions>=4.15.0",
    "types-tabulate>=0.10.0.20260408",
    "pandas-stubs>=2.3.3.260113", # Latest release still supporting Python3.10
    "types-psutil>=7.2.2.20260408"
]

[project.urls]
Repository = "https://github.com/Perfexionists/perun.git"
Demonstration = "https://www.fit.vutbr.cz/research/groups/verifit/tools/perun-demo/"
Changelog = "https://github.com/Perfexionists/perun/blob/master/CHANGELOG.rst"

[project.scripts]
perun = "perun.cli:launch_cli"

# Mypy configuration
# ----------------------
[tool.mypy]
# TODO: remove after bumping numpy to >=2.3.0 (Only for Python3.11+)
plugins = [
    "numpy.typing.mypy_plugin"
]
exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    "build",
    "docs",
    "perun.egg-info",
    "perun_toolsuite.egg-info",
    "venv",
    # Fixme: Temporary exclude
    "perun/collect/trace"
]
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

# Some packages are not shipping type hints yet, ignore the 'missing import' errors
[[tool.mypy.overrides]]
module = [
    "networkx.*",
    "matplotlib.*",
    "scipy.*",
    "sklearn.*",
    "statsmodels.*",
    "holoviews.*",
    "bcc.*",
    "lazy_loader.*",
]
ignore_missing_imports = true

# Ignore thirdparty package as it contains ported code that is hard to type
[[tool.mypy.overrides]]
module = [
    "perun.thirdparty.*"
]
ignore_errors = true

# Fixme: Temporary, we omit trace from checking
[[tool.mypy-overrides]]
module = [
    "perun.collect.trace.*"
]
ignore_errors = true
follow_imports = "skip"

# Pylint configuration
# --------------------
[tool.pylint]
ignore-paths = [
    "perun/thirdparty/*"
]


# Pytest configuration
# --------------------
[tool.pytest.ini_options]
addopts = "-p no:warnings -p no:logging"
norecursedirs = [
    "case-studies",
    "venv",
    "docs",
    "*.egg-info",
    ".git",
    ".tox",
    "build",
    ".mypy_cache",
    "perun/thirdparty"
]

# Coverage configuration
# ----------------------
[tool.coverage.run]
source = [
    "perun",
]
omit = [
    "tests/*",
    "perun/collect/trace/*",
    "perun/thirdparty/*",
    "perun/scripts/"  # FIXME: The Python scripts are only temporary.
]

[tool.coverage.report]
exclude_also = [
    # Exclude type checking specific lines, that are never executed
    "if TYPE_CHECKING:",

    # Exclude protocols, that are used for type checking
    "class CallableDetectionMethod(Protocol):",
    "class Comparable(Protocol):",

    # Exclude overloads, that are used for type checking
    "@overload",

    # Not implemented asserst are omitted
    "assert NotImplementedError(.*)",

    # Exclude lines that run the module as script
    'if __name__ == "__main__":'
]

# Formatting configuration
# ----------------------
[tool.black]
target-version = [
    "py310",
    "py311",
    "py312",
    "py313",
    "py314",
]
line-length = 100
