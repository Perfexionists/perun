name: Setup Environment
description: Performs setup of Perun, Python and its dependencies
inputs:
  python-version:
    description: 'Python version to run'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Install Unix dependencies
      if: runner.os == 'Linux'
      shell: sh
      run: |
        sudo apt-get -qq update
        sudo apt-get install time libunwind8-dev g++ gcc git linux-tools-generic
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: sh
      run: |
        brew update
        brew install gnu-time gcc git libunwind-headers libmagic coreutils

    # The rust toolchain is required for building some packages (e.g., angr) that have no wheels for particular archs.
    - name: Set up Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy, rustfmt

    - name: Initialize Git
      shell: sh
      run: |
        git config --global user.email "perun-allmighty@gmail.com"
        git config --global user.name "Perun Allmighty"

    - name: Upgrade pip and build dependencies
      shell: sh
      run: |
        python -m pip install --upgrade pip meson meson-python ninja

    - name: Install Tox
      shell: sh
      run: |
        pip install tox
